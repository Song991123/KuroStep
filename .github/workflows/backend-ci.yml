name: KuroStep Backend CI

on:
  push:
    branches: ["main", "master"]
    paths:
      - "KuroStep/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "KuroStep/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KuroStep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run backend tests
        run: ./gradlew test
