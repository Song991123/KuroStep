name: Deploy KuroStep API to EC2

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: KuroStep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Test and build jar
        run: ./gradlew clean test bootJar

      - name: Prepare deploy bundle
        run: |
          mkdir -p deploy
          cp Dockerfile.prod deploy/Dockerfile
          cp docker-compose.prod.yml deploy/docker-compose.yml
          cp build/libs/*.jar deploy/app.jar

      - name: Upload files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "KuroStep/deploy/*"
          target: "/opt/kurostep"
          strip_components: 2

      - name: Restart API on EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          MYSQL_DATABASE: kurostep
          MYSQL_USER: kurostep
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          KUROSTEP_JWT_SECRET: ${{ secrets.KUROSTEP_JWT_SECRET }}
          KUROSTEP_JWT_EXPIRATION_MINUTES: "120"
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MYSQL_DATABASE,MYSQL_USER,MYSQL_PASSWORD,MYSQL_ROOT_PASSWORD,KUROSTEP_JWT_SECRET,KUROSTEP_JWT_EXPIRATION_MINUTES
          script: |
            set -eu
            cd /opt/kurostep
            cat > .env <<EOF
            MYSQL_DATABASE=${MYSQL_DATABASE}
            MYSQL_USER=${MYSQL_USER}
            MYSQL_PASSWORD=${MYSQL_PASSWORD}
            MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            KUROSTEP_JWT_SECRET=${KUROSTEP_JWT_SECRET}
            KUROSTEP_JWT_EXPIRATION_MINUTES=${KUROSTEP_JWT_EXPIRATION_MINUTES}
            EOF
            docker compose down
            docker compose up -d --build
            docker compose ps
