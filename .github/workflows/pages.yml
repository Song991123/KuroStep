name: Deploy KuroStep Widget to GitHub Pages

on:
  push:
    branches: ["main", "master"]
    paths:
      - "kurostep-tauri-widget/src-react/**"
      - "kurostep-tauri-widget/public/**"
      - "kurostep-tauri-widget/index.html"
      - "kurostep-tauri-widget/package.json"
      - "kurostep-tauri-widget/package-lock.json"
      - "kurostep-tauri-widget/tsconfig.json"
      - "kurostep-tauri-widget/vite.config.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kurostep-tauri-widget/package-lock.json

      - name: Install frontend dependencies
        working-directory: kurostep-tauri-widget
        run: npm ci

      - name: Build React widget
        working-directory: kurostep-tauri-widget
        run: npm run build:web

      - name: Upload React widget
        uses: actions/upload-pages-artifact@v3
        with:
          path: kurostep-tauri-widget/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
