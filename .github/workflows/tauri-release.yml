name: Build KuroStep Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kurostep-tauri-widget/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: kurostep-tauri-widget
        run: npm ci

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: kurostep-tauri-widget
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "KuroStep ${{ env.RELEASE_TAG }}"
          releaseBody: |
            KuroStep desktop app installers.

            Download from Assets:
            - macOS: `.dmg`
            - Windows: `.msi` or `.exe`

            GitHub also shows automatic "Source code" archives, but those are repository snapshots for developers. For normal app install, use the installer assets above.

            Note for macOS: this build is ad-hoc signed for a personal portfolio release. If macOS Gatekeeper blocks it because it is not notarized with an Apple Developer ID, open it from Finder with Control-click > Open, or remove quarantine locally for testing.
          releaseDraft: false
          prerelease: false
