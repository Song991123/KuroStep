name: Build KuroStep Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.2.1"
        required: true
        default: "v0.2.1"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RELEASE_TAG=${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kurostep-tauri-widget/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        working-directory: kurostep-tauri-widget
        run: npm ci

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: kurostep-tauri-widget
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "KuroStep ${{ env.RELEASE_TAG }}"
          releaseBody: |
            KuroStep desktop widget release.

            - GitHub Pages React UI
            - Tauri desktop shell
            - macOS and Windows bundles generated by GitHub Actions
            - Spring Boot API integration target: EC2 HTTPS API
          releaseDraft: true
          prerelease: false
