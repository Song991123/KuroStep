spring:
  application:
    name: KuroStep

  datasource:
    url: jdbc:h2:mem:kurostep
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

kurostep:
  jwt:
    secret: ${KUROSTEP_JWT_SECRET:kurostep-local-development-secret-key-change-before-production}
    expiration-minutes: ${KUROSTEP_JWT_EXPIRATION_MINUTES:10080}
  lyrics:
    lrclib-base-url: ${KUROSTEP_LRCLIB_BASE_URL:https://lrclib.net}
  translation:
    mymemory-base-url: ${KUROSTEP_MYMEMORY_BASE_URL:https://api.mymemory.translated.net}
    deepl-base-url: ${KUROSTEP_DEEPL_BASE_URL:https://api-free.deepl.com}
    deepl-api-key: ${KUROSTEP_DEEPL_API_KEY:}
