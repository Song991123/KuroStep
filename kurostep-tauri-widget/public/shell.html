<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KuroStep Shell</title>
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body>
    <section class="shell-window" id="shell-window">
      <header class="shell-header" id="shell-drag-region" data-tauri-drag-region>
        <div class="shell-tools">
          <button class="shell-tool-button" id="shell-minimize" type="button" aria-label="최소화" title="최소화">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10" /></svg>
          </button>
        </div>
        <strong class="shell-title" data-tauri-drag-region>
          <svg class="shell-title-mark" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M32 34.5c-9.6 0-18.5 7.4-18.5 16.2 0 5.3 4.1 8.8 9.4 7.3 3.1-.9 5.3-2.2 9.1-2.2s6 1.3 9.1 2.2c5.3 1.5 9.4-2 9.4-7.3 0-8.8-8.9-16.2-18.5-16.2Z" />
            <path d="M18.4 29.2c4.2-.8 6.8-5.7 5.8-11s-5.3-8.9-9.5-8.1-6.8 5.7-5.8 11 5.3 8.9 9.5 8.1Z" />
            <path d="M45.6 29.2c-4.2-.8-6.8-5.7-5.8-11s5.3-8.9 9.5-8.1 6.8 5.7 5.8 11-5.3 8.9-9.5 8.1Z" />
            <path d="M30.1 25.8c4.2-.4 7.1-5.3 6.6-10.9S32.1 5 27.9 5.4 20.8 10.7 21.3 16.3s4.6 9.9 8.8 9.5Z" />
            <path d="M33.9 25.8c-4.2-.4-7.1-5.3-6.6-10.9s4.6-9.9 8.8-9.5 7.1 5.3 6.6 10.9-4.6 9.9-8.8 9.5Z" />
          </svg>
          <span>KuroStep</span>
        </strong>
        <div class="shell-actions" id="shell-actions"></div>
      </header>
      <iframe id="shell-frame" title="KuroStep content" allow="autoplay; encrypted-media; picture-in-picture; web-share"></iframe>
    </section>
    <script src="./shell.js" defer></script>
  </body>
</html>
