[package]
name = "kurostep-tauri-widget"
version = "0.2.0"
description = "Small macOS Tauri widget for KuroStep"
authors = ["maren"]
edition = "2021"

[lib]
name = "kurostep_tauri_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "KuroStep"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
