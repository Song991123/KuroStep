<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KuroStep Widget Controls Mockup</title>
<style>
  :root {
    --bg-cream: #F7F5F0;
    --text-charcoal: #2D2D2D;
    --point-gold: #E6B91E;
    --border-light: #E0DCD3;
    --cat-black: #1A1A1A;
    --soft-panel: #EFEBE1;
  }

  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .widget-container {
    width: 360px;
    background-color: var(--bg-cream);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15), 0 1px 3px rgba(0, 0, 0, 0.05);
    overflow: hidden;
    color: var(--text-charcoal);
  }

  .mac-header {
    height: 28px;
    background-color: var(--soft-panel);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px 0 16px;
    border-bottom: 1px solid var(--border-light);
  }

  .mac-dots {
    display: flex;
    gap: 6px;
  }

  .mac-dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-red { background-color: #FF5F56; }
  .dot-yellow { background-color: #FFBD2E; }
  .dot-green { background-color: #27C93F; }

  .window-title {
    color: #8f8981;
    font-size: 11px;
    font-weight: 700;
  }

  .section {
    padding: 16px;
    border-bottom: 1px dotted var(--border-light);
  }
  .section:last-child { border-bottom: none; }

  .section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }

  .section-title {
    font-size: 12px;
    font-weight: 700;
    color: #888;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .tool-button,
  .icon-button {
    border: 1px solid var(--border-light);
    border-radius: 999px;
    background-color: #fffdf8;
    color: #5f5a53;
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    cursor: default;
  }

  .tool-button {
    height: 25px;
    padding: 0 9px;
  }

  .icon-button {
    width: 25px;
    height: 25px;
    display: inline-grid;
    place-items: center;
    padding: 0;
  }

  .button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }

  .task-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }

  .task-title {
    font-size: 16px;
    font-weight: bold;
    margin: 0;
    line-height: 1.25;
  }

  .status-badges {
    display: flex;
    gap: 4px;
    margin-top: 8px;
  }

  .badge {
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 12px;
    border: 1px solid var(--border-light);
    color: #666;
    cursor: default;
  }
  .badge.active { background-color: var(--cat-black); color: white; border-color: var(--cat-black); }

  .player-area {
    display: flex;
    align-items: center;
    gap: 18px;
    position: relative;
    padding: 10px 0 10px;
  }

  .record-wrap {
    position: relative;
    width: 72px;
    height: 66px;
    flex: 0 0 72px;
  }

  .record {
    width: 60px;
    height: 60px;
    background:
      radial-gradient(circle at center, transparent 0 10px, #111 11px 13px, transparent 14px),
      repeating-radial-gradient(circle at center, #1a1a1a 0 7px, #242321 8px 10px);
    border-radius: 50%;
    position: absolute;
    left: 0;
    bottom: 0;
    z-index: 2;
    transition: transform 0.3s ease;
  }

  .record-label {
    position: absolute;
    inset: 19px;
    border-radius: 50%;
    background-color: var(--point-gold);
    z-index: 2;
  }

  .paw-print {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16px;
    height: 15px;
    transform: translate(-50%, -50%) rotate(-14deg);
    opacity: 0.9;
    z-index: 3;
  }

  .paw-print span {
    position: absolute;
    display: block;
    background-color: var(--cat-black);
    border-radius: 50%;
  }

  .paw-print span:nth-child(1) { width: 8px; height: 7px; left: 4px; bottom: 0; }
  .paw-print span:nth-child(2) { width: 4px; height: 5px; left: 0; top: 5px; }
  .paw-print span:nth-child(3) { width: 4px; height: 5px; left: 6px; top: 1px; }
  .paw-print span:nth-child(4) { width: 4px; height: 5px; right: 0; top: 5px; }

  .cat-tail {
    position: absolute;
    width: 40px;
    height: 12px;
    background-color: var(--cat-black);
    border-radius: 10px;
    left: 45px;
    top: 20px;
    z-index: 1;
    transform-origin: left center;
    transform: rotate(45deg) translateY(10px);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    opacity: 0;
  }

  .player-area:hover .record,
  .player-area.playing .record {
    animation: spin 4s linear infinite;
  }

  .player-area:hover .cat-tail,
  .player-area.playing .cat-tail {
    transform: rotate(0deg) translateY(0);
    opacity: 1;
  }

  @keyframes spin { 100% { transform: rotate(360deg); } }

  .track-info {
    position: relative;
    z-index: 4;
    min-width: 0;
    padding-left: 8px;
  }

  .track-info h4 {
    margin: 0;
    font-size: 14px;
    color: var(--text-charcoal);
  }

  .track-info p {
    margin: 2px 0 0 0;
    font-size: 12px;
    color: #888;
  }

  .track-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }

  .playlist-item {
    display: grid;
    grid-template-columns: 16px minmax(0, 1fr) auto 25px;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    padding: 6px 0;
    color: #555;
  }

  .playlist-item.playing {
    font-weight: bold;
    color: var(--cat-black);
  }

  .playlist-item::before {
    content: '';
    width: 16px;
  }

  .playlist-item.playing::before {
    content: '•';
    color: var(--cat-black);
    font-size: 18px;
    line-height: 1;
    transform: rotate(-12deg);
  }

  .playlist-item span:first-of-type {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .playlist-item .row-action {
    justify-self: end;
    color: #9a948c;
    font-size: 12px;
  }

  .lyric-box {
    background-color: var(--soft-panel);
    padding: 10px;
    border-radius: 6px;
    font-size: 13px;
    font-style: italic;
    color: var(--text-charcoal);
    margin-bottom: 8px;
    border-left: 3px solid var(--cat-black);
  }

  .memo-box {
    font-size: 13px;
    padding: 8px;
    background-color: white;
    border: 1px solid var(--border-light);
    border-radius: 6px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
  }
</style>
</head>
<body>

<div class="widget-container">
  <div class="mac-header">
    <div class="mac-dots">
      <div class="mac-dot dot-red"></div>
      <div class="mac-dot dot-yellow"></div>
      <div class="mac-dot dot-green"></div>
    </div>
    <div class="window-title">KuroStep</div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">TODAY'S WORK</div>
      <button class="tool-button" type="button">+ 작업</button>
    </div>
    <div class="task-header">
      <h3 class="task-title">2막 대사 번역 정리</h3>
      <button class="icon-button" type="button" aria-label="Edit task">✎</button>
    </div>
    <div class="status-badges">
      <div class="badge">TODO</div>
      <div class="badge active">DOING</div>
      <div class="badge">DONE</div>
    </div>
    <div class="button-row">
      <button class="tool-button" type="button">상태 변경</button>
      <button class="tool-button" type="button">플리 연결</button>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">NOW PLAYING</div>
      <button class="tool-button" type="button">+ 곡</button>
    </div>
    <div class="player-area playing" title="재생 중">
      <div class="record-wrap">
        <div class="cat-tail"></div>
        <div class="record">
          <span class="record-label"></span>
          <span class="paw-print" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </span>
        </div>
      </div>

      <div class="track-info">
        <h4>Night Window</h4>
        <p>Moonlit Room • Midnight Draft</p>
        <div class="track-actions">
          <button class="tool-button" type="button">현재곡 변경</button>
          <button class="tool-button" type="button">링크 열기</button>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">PLAYLIST</div>
      <button class="tool-button" type="button">관리</button>
    </div>
    <div class="playlist-item playing">
      <span>Night Window</span>
      <span>03:42</span>
      <button class="icon-button row-action" type="button" aria-label="Remove track">−</button>
    </div>
    <div class="playlist-item">
      <span>Soft Static</span>
      <span>02:58</span>
      <button class="icon-button row-action" type="button" aria-label="Remove track">−</button>
    </div>
    <div class="playlist-item">
      <span>Ink Before Dawn</span>
      <span>04:10</span>
      <button class="icon-button row-action" type="button" aria-label="Remove track">−</button>
    </div>
    <div class="button-row">
      <button class="tool-button" type="button">+ 플레이리스트</button>
      <button class="tool-button" type="button">+ 곡 추가</button>
      <button class="tool-button" type="button">순서 편집</button>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">LYRIC MEMO</div>
      <button class="tool-button" type="button">라인 선택</button>
    </div>
    <div class="lyric-box">
      "keep the light low, let the quiet decide"
    </div>
    <div class="memo-box">
      불을 낮추고, 조용함이 장면의 감정을 정하게 둔다. (분위기 전환 포인트)
    </div>
    <div class="button-row">
      <button class="tool-button" type="button">메모 편집</button>
      <button class="tool-button" type="button">저장</button>
    </div>
  </div>

</div>

</body>
</html>
