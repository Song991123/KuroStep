<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KuroStep Widget</title>
<style>
  /* 1. 기본 설정 (도화지 준비) */
  :root {
    --bg-cream: #F7F5F0;
    --text-charcoal: #2D2D2D;
    --point-gold: #E6B91E;
    --border-light: #E0DCD3;
    --cat-black: #1A1A1A;
  }

  body {
    background-color: transparent; /* 데스크톱 위젯이므로 배경은 투명하게 */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* 2. 위젯 본체 (검은 테두리 제거 & Mac 스타일 둥근 모서리) */
  .widget-container {
    width: 360px;
    background-color: var(--bg-cream);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15), 0 1px 3px rgba(0, 0, 0, 0.05);
    overflow: hidden; /* 둥근 모서리 밖으로 튀어나가는 것 방지 */
    color: var(--text-charcoal);
  }

  /* Mac 스타일 헤더 */
  .mac-header {
    height: 28px;
    background-color: #EFEBE1;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 6px;
    border-bottom: 1px solid var(--border-light);
  }
  .mac-dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot-red { background-color: #FF5F56; }
  .dot-yellow { background-color: #FFBD2E; }
  .dot-green { background-color: #27C93F; }

  /* 3. 섹션 나누기 (레고 블록 조립) */
  .section {
    padding: 16px;
    border-bottom: 1px dotted var(--border-light);
  }
  .section:last-child { border-bottom: none; }

  .section-title {
    font-size: 12px;
    font-weight: 700;
    color: #888;
    margin: 0 0 8px 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* --- Task Widget --- */
  .task-header { display: flex; justify-content: space-between; align-items: center; }
  .task-title { font-size: 16px; font-weight: bold; margin: 0; }
  .status-badges { display: flex; gap: 4px; margin-top: 8px; }
  .badge {
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 12px;
    border: 1px solid var(--border-light);
    color: #666;
    cursor: pointer;
  }
  .badge.active { background-color: var(--cat-black); color: white; border-color: var(--cat-black); }

  /* --- Player & Cat Interaction (핵심 부분!) --- */
  .player-area {
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
    padding: 10px 0;
  }

  /* 레코드판 */
  .record {
    width: 60px;
    height: 60px;
    background-color: var(--cat-black);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 2;
    transition: transform 0.3s ease;
  }
  .record::after {
    content: '';
    width: 20px;
    height: 20px;
    background-color: var(--point-gold);
    border-radius: 50%;
  }

  /* 고양이 꼬리 (레코드판 뒤에 숨어있음) */
  .cat-tail {
    position: absolute;
    width: 54px;
    height: 48px;
    left: 38px;
    top: 12px;
    z-index: 1;
    transform-origin: 5px 36px;
    transform: rotate(42deg) translate(-12px, 20px) scale(0.72); /* 평소엔 내려가 있음 */
    transition:
      opacity 0.2s ease,
      transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.18);
    opacity: 0;
  }
  .cat-tail::before {
    content: '';
    position: absolute;
    inset: 0;
    border-top: 10px solid var(--cat-black);
    border-right: 10px solid var(--cat-black);
    border-radius: 0 42px 0 0;
  }

  /* 재생 상태 (마우스를 올렸을 때) 애니메이션 */
  .player-area:hover .record {
    animation: spin 4s linear infinite; /* 레코드판 회전 */
  }
  .player-area:hover .cat-tail,
  .player-area.playing .cat-tail {
    transform: rotate(-10deg) translate(0, 0) scale(1); /* 곡선 꼬리가 레코드판 위로 척 */
    opacity: 1;
  }

  @keyframes spin { 100% { transform: rotate(360deg); } }

  .track-info h4 { margin: 0; font-size: 14px; color: var(--text-charcoal); }
  .track-info p { margin: 2px 0 0 0; font-size: 12px; color: #888; }
  .track-info { position: relative; z-index: 4; }

  /* --- Playlist Widget --- */
  .playlist-item {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 6px 0;
    color: #555;
  }
  .playlist-item.playing {
    font-weight: bold;
    color: var(--cat-black);
  }
  .playlist-item.playing::before {
    content: '🐾';
    font-size: 10px;
    margin-right: 4px;
  }

  /* --- Lyric & Memo Widget --- */
  .lyric-box {
    background-color: #EFEBE1;
    padding: 10px;
    border-radius: 6px;
    font-size: 13px;
    font-style: italic;
    color: var(--text-charcoal);
    margin-bottom: 8px;
    border-left: 3px solid var(--cat-black);
  }
  .memo-box {
    font-size: 13px;
    padding: 8px;
    background-color: white;
    border: 1px solid var(--border-light);
    border-radius: 6px;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
  }
</style>
</head>
<body>

<div class="widget-container">
  <div class="mac-header">
    <div class="mac-dot dot-red"></div>
    <div class="mac-dot dot-yellow"></div>
    <div class="mac-dot dot-green"></div>
  </div>

  <div class="section">
    <div class="section-title">TODAY'S WORK</div>
    <div class="task-header">
      <h3 class="task-title">2막 대사 번역 정리</h3>
    </div>
    <div class="status-badges">
      <div class="badge">TODO</div>
      <div class="badge active">DOING</div>
      <div class="badge">DONE</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">NOW PLAYING</div>
    <div class="player-area playing" title="여기에 마우스를 올려보세요!">
      <div class="cat-tail"></div>
      <div class="record"></div>

      <div class="track-info">
        <h4>Night Window</h4>
        <p>Moonlit Room • Midnight Draft</p>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">PLAYLIST</div>
    <div class="playlist-item playing">
      <span>Night Window</span>
      <span>03:42</span>
    </div>
    <div class="playlist-item">
      <span>Soft Static</span>
      <span>02:58</span>
    </div>
    <div class="playlist-item">
      <span>Ink Before Dawn</span>
      <span>04:10</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">LYRIC MEMO</div>
    <div class="lyric-box">
      "keep the light low, let the quiet decide"
    </div>
    <div class="memo-box">
      불을 낮추고, 조용함이 장면의 감정을 정하게 둔다. (분위기 전환 포인트)
    </div>
  </div>

</div>

</body>
</html>
